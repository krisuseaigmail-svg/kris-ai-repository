# 预览用：可 docker compose 在线构建，不占用生产卷名 delivery_ledger_pgdata。
# 启动: docker compose -f docker-compose.preview.yml --env-file .env up -d --build
name: asset-ledger-preview

services:
  postgres:
    image: postgres:16
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: Dockerfile.preview
    image: asset-ledger:0.1.0-preview
    ports:
      - "${APP_PORT:-8010}:8000"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      APP_VERSION: ${APP_VERSION:-0.1.0}
      PRODUCT_CODE: asset-ledger
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    name: asset_ledger_preview_pgdata
