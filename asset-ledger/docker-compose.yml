name: asset-ledger

services:
  postgres:
    image: postgres:16
    pull_policy: never
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
    entrypoint: ["/bin/bash", "/pg-guard.sh"]
    command: ["postgres"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/pg-guard.sh:/pg-guard.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  app:
    image: asset-ledger:${APP_VERSION:-0.1.0}
    pull_policy: never
    ports:
      - "${APP_PORT:-8010}:8000"
    env_file:
      - .env
    environment:
      TZ: Asia/Shanghai
      APP_VERSION: ${APP_VERSION:-0.1.0}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
    name: delivery_ledger_pgdata
